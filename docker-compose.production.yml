# Production service behind an existing Traefik and SSO. Configured entirely from `.env` (see .env.dist and README, "Install on a server").
# Standalone: do not combine it with the local compose files (they publish ports).
name: redline

services:
  redline:
    build: .
    restart: unless-stopped
    user: "1000:1000"
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    mem_limit: 1g
    pids_limit: 256
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"
    environment:
      TZ: ${TZ:-Europe/Paris}
      REDLINE_ARTBOARD_ORIGIN: https://${REDLINE_ARTBOARD_HOST:?Set REDLINE_ARTBOARD_HOST in .env}
      REDLINE_PROXY_SECRET_HUMAN_FILE: /run/secrets/redline_proxy_secret_human
      REDLINE_PROXY_SECRET_MACHINE_FILE: /run/secrets/redline_proxy_secret_machine
      REDLINE_IDENTITY_HEADER_USER: ${REDLINE_IDENTITY_HEADER_USER:-Remote-User}
      REDLINE_IDENTITY_HEADER_NAME: ${REDLINE_IDENTITY_HEADER_NAME:-Remote-Name}
      REDLINE_IDENTITY_HEADER_EMAIL: ${REDLINE_IDENTITY_HEADER_EMAIL:-Remote-Email}
      REDLINE_LOGOUT_URL: ${REDLINE_LOGOUT_URL:-}
    secrets:
      - redline_proxy_secret_human
      - redline_proxy_secret_machine
    volumes:
      - redline-data:/data
    networks:
      - traefik
    labels:
      - traefik.enable=true
      - traefik.docker.network=${REDLINE_TRAEFIK_NETWORK:-traefik}

      # Services
      - traefik.http.services.${REDLINE_TRAEFIK_PREFIX:-redline}-ui.loadbalancer.server.port=3000
      - traefik.http.services.${REDLINE_TRAEFIK_PREFIX:-redline}-artboards.loadbalancer.server.port=3001

      # Middlewares
      - traefik.http.middlewares.${REDLINE_TRAEFIK_PREFIX:-redline}-headers.headers.stsSeconds=31536000
      - traefik.http.middlewares.${REDLINE_TRAEFIK_PREFIX:-redline}-headers.headers.stsIncludeSubdomains=true
      - traefik.http.middlewares.${REDLINE_TRAEFIK_PREFIX:-redline}-body.buffering.maxRequestBodyBytes=22020096
      - traefik.http.middlewares.${REDLINE_TRAEFIK_PREFIX:-redline}-secret-human.headers.customrequestheaders.X-Redline-Proxy-Secret=${REDLINE_PROXY_SECRET_HUMAN:?Run scripts/generate-secrets.sh}
      - traefik.http.middlewares.${REDLINE_TRAEFIK_PREFIX:-redline}-secret-machine.headers.customrequestheaders.X-Redline-Proxy-Secret=${REDLINE_PROXY_SECRET_MACHINE:?Run scripts/generate-secrets.sh}
      - traefik.http.middlewares.${REDLINE_TRAEFIK_PREFIX:-redline}-strip-identity.headers.customrequestheaders.${REDLINE_IDENTITY_HEADER_USER:-Remote-User}=
      - traefik.http.middlewares.${REDLINE_TRAEFIK_PREFIX:-redline}-strip-identity.headers.customrequestheaders.${REDLINE_IDENTITY_HEADER_NAME:-Remote-Name}=
      - traefik.http.middlewares.${REDLINE_TRAEFIK_PREFIX:-redline}-strip-identity.headers.customrequestheaders.${REDLINE_IDENTITY_HEADER_EMAIL:-Remote-Email}=
      - traefik.http.middlewares.${REDLINE_TRAEFIK_PREFIX:-redline}-ratelimit.ratelimit.average=120
      - traefik.http.middlewares.${REDLINE_TRAEFIK_PREFIX:-redline}-ratelimit.ratelimit.period=1m
      - traefik.http.middlewares.${REDLINE_TRAEFIK_PREFIX:-redline}-ratelimit.ratelimit.burst=60
      - traefik.http.middlewares.${REDLINE_TRAEFIK_PREFIX:-redline}-https.redirectscheme.scheme=https
      - traefik.http.middlewares.${REDLINE_TRAEFIK_PREFIX:-redline}-https.redirectscheme.permanent=true

      # Human UI and API (behind the SSO)
      - traefik.http.routers.${REDLINE_TRAEFIK_PREFIX:-redline}-ui.rule=Host(`${REDLINE_UI_HOST:?Set REDLINE_UI_HOST in .env}`)
      - traefik.http.routers.${REDLINE_TRAEFIK_PREFIX:-redline}-ui.priority=10
      - traefik.http.routers.${REDLINE_TRAEFIK_PREFIX:-redline}-ui.entrypoints=${REDLINE_ENTRYPOINT_HTTPS:-websecure}
      - traefik.http.routers.${REDLINE_TRAEFIK_PREFIX:-redline}-ui.tls.certresolver=${REDLINE_CERT_RESOLVER:-letsencrypt}
      - traefik.http.routers.${REDLINE_TRAEFIK_PREFIX:-redline}-ui.service=${REDLINE_TRAEFIK_PREFIX:-redline}-ui
      - traefik.http.routers.${REDLINE_TRAEFIK_PREFIX:-redline}-ui.middlewares=${REDLINE_TRAEFIK_PREFIX:-redline}-headers,${REDLINE_TRAEFIK_PREFIX:-redline}-strip-identity,${REDLINE_AUTH_MIDDLEWARE:?Set REDLINE_AUTH_MIDDLEWARE in .env},${REDLINE_TRAEFIK_PREFIX:-redline}-body,${REDLINE_TRAEFIK_PREFIX:-redline}-secret-human

      # Human artboard origin (behind the SSO)
      - traefik.http.routers.${REDLINE_TRAEFIK_PREFIX:-redline}-artboards.rule=Host(`${REDLINE_ARTBOARD_HOST}`)
      - traefik.http.routers.${REDLINE_TRAEFIK_PREFIX:-redline}-artboards.priority=10
      - traefik.http.routers.${REDLINE_TRAEFIK_PREFIX:-redline}-artboards.entrypoints=${REDLINE_ENTRYPOINT_HTTPS:-websecure}
      - traefik.http.routers.${REDLINE_TRAEFIK_PREFIX:-redline}-artboards.tls.certresolver=${REDLINE_CERT_RESOLVER:-letsencrypt}
      - traefik.http.routers.${REDLINE_TRAEFIK_PREFIX:-redline}-artboards.service=${REDLINE_TRAEFIK_PREFIX:-redline}-artboards
      - traefik.http.routers.${REDLINE_TRAEFIK_PREFIX:-redline}-artboards.middlewares=${REDLINE_TRAEFIK_PREFIX:-redline}-headers,${REDLINE_TRAEFIK_PREFIX:-redline}-strip-identity,${REDLINE_AUTH_MIDDLEWARE},${REDLINE_TRAEFIK_PREFIX:-redline}-body,${REDLINE_TRAEFIK_PREFIX:-redline}-secret-human

      # Machine paths (agents and CLI download): no SSO, guarded by the agents' token
      - traefik.http.routers.${REDLINE_TRAEFIK_PREFIX:-redline}-machine.rule=Host(`${REDLINE_UI_HOST}`) && (Path(`/agent`) || PathPrefix(`/agent-api/`) || PathPrefix(`/cli/`))
      - traefik.http.routers.${REDLINE_TRAEFIK_PREFIX:-redline}-machine.priority=100
      - traefik.http.routers.${REDLINE_TRAEFIK_PREFIX:-redline}-machine.entrypoints=${REDLINE_ENTRYPOINT_HTTPS:-websecure}
      - traefik.http.routers.${REDLINE_TRAEFIK_PREFIX:-redline}-machine.tls.certresolver=${REDLINE_CERT_RESOLVER:-letsencrypt}
      - traefik.http.routers.${REDLINE_TRAEFIK_PREFIX:-redline}-machine.service=${REDLINE_TRAEFIK_PREFIX:-redline}-ui
      - traefik.http.routers.${REDLINE_TRAEFIK_PREFIX:-redline}-machine.middlewares=${REDLINE_TRAEFIK_PREFIX:-redline}-headers,${REDLINE_TRAEFIK_PREFIX:-redline}-strip-identity,${REDLINE_TRAEFIK_PREFIX:-redline}-body,${REDLINE_TRAEFIK_PREFIX:-redline}-ratelimit,${REDLINE_TRAEFIK_PREFIX:-redline}-secret-machine

      # Plain HTTP: redirect to HTTPS
      - traefik.http.routers.${REDLINE_TRAEFIK_PREFIX:-redline}-ui-http.rule=Host(`${REDLINE_UI_HOST}`)
      - traefik.http.routers.${REDLINE_TRAEFIK_PREFIX:-redline}-ui-http.entrypoints=${REDLINE_ENTRYPOINT_HTTP:-web}
      - traefik.http.routers.${REDLINE_TRAEFIK_PREFIX:-redline}-ui-http.middlewares=${REDLINE_TRAEFIK_PREFIX:-redline}-https
      - traefik.http.routers.${REDLINE_TRAEFIK_PREFIX:-redline}-ui-http.service=noop@internal
      - traefik.http.routers.${REDLINE_TRAEFIK_PREFIX:-redline}-artboards-http.rule=Host(`${REDLINE_ARTBOARD_HOST}`)
      - traefik.http.routers.${REDLINE_TRAEFIK_PREFIX:-redline}-artboards-http.entrypoints=${REDLINE_ENTRYPOINT_HTTP:-web}
      - traefik.http.routers.${REDLINE_TRAEFIK_PREFIX:-redline}-artboards-http.middlewares=${REDLINE_TRAEFIK_PREFIX:-redline}-https
      - traefik.http.routers.${REDLINE_TRAEFIK_PREFIX:-redline}-artboards-http.service=noop@internal

secrets:
  redline_proxy_secret_human:
    file: ./secrets/proxy-secret-human
  redline_proxy_secret_machine:
    file: ./secrets/proxy-secret-machine

networks:
  traefik:
    name: ${REDLINE_TRAEFIK_NETWORK:-traefik}
    external: true

volumes:
  redline-data:
